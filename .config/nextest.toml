[profile.default]
failure-output = "final"
slow-timeout = { period = "60s" }

[profile.ci]
fail-fast = false
failure-output = "final"
slow-timeout = { period = "60s" }

[profile.asan]
inherits = "ci"
default-filter = "not (test(stress))"

[profile.loom]
inherits = "ci"
default-filter = "binary(loom)"
